<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Caving</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: monospace;
            background: #0b0b0b;
            color: #eee;
            overflow: hidden;
        }

        #game {
            position: relative;

            width: min(1100px, 96vw);
            height: 100vh;
            margin: auto;
            padding: 12px 0;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           TOP BAR
           ========================= */

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 22px;
            margin: 0;
        }

        #stats {
            display: flex;
            gap: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        #timer {
            min-width: 55px;
            text-align: right;
            padding-left: 10px;
            border-left: 1px solid #ccc;
            margin-left: 3px;
        }

        #score {
            padding-left: 10px;
            border-left: 1px solid #ccc;
        }

        /* =========================
           CURRENT WORD
           ========================= */

        #current-word-container {
            height: 45px;
            flex-shrink: 0;
            text-align: center;
        }

        #current-word {
            height: 28px;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        #message {
            height: 17px;
            font-size: 13px;
        }

        /* =========================
           PUZZLES
           ========================= */

        #puzzles {
            flex: 1;
            min-height: 0;

            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, minmax(0, 1fr));

            gap: 8px;
        }

        .puzzle {
            min-height: 0;
            background: black;
            border: 1px solid #bbb;
            border-radius: 6px;

            padding: 8px;

            display: flex;
            flex-direction: column;
            align-items: center;

            overflow: hidden;
        }

        .puzzle.solved {
            background: #002200;
            border: 1px solid #008800;
        }

        .puzzle.bonus {
            background: #00221d;
            border: 1px solid #008877;
        }

        .bonus-container {
            margin-top: 6px;
            display: flex;
            flex-direction: column;
        }

        .bonus-word {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 0;
            margin-top: 4px;
            margin: 0 0;
            flex-shrink: 0;
            display: block;
            text-align: center;
        }

        .bonus-label {
            font-size: 10px;
            font-weight: normal;
            letter-spacing: 0;
            margin: 0 0;
            display: block;
            text-align: center;
        }

        .puzzle-number {
            color: #777;
            font-size: 11px;
            flex-shrink: 0;
        }

        .puzzle-word {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
            margin: 2px 0;
            flex-shrink: 0;
        }

        .puzzle-status {
            font-size: 11px;
            color: #555;
            text-align: center;
            flex-shrink: 0;
        }

        /* =========================
           SOLUTION / SCORE BREAKDOWN
           ========================= */

        .solution {
            margin-top: 5px;
            width: 100%;
            text-align: left;
            font-size: 11px;
            line-height: 1.3;
            flex-shrink: 0;
        }

        .solution-word {
            text-align: center;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 2px;
        }

        .solution-total {
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .score-breakdown {
            width: fit-content;
            margin: 0 auto;
        }

        .score-line {
            display: grid;
            grid-template-columns: 10ch 5ch;
            column-gap: 1ch;
        }

        .score-label {
            text-align: left;
            white-space: nowrap;
        }

        .score-value {
            text-align: right;
        }

        /* =========================
           ANSWERS
           ========================= */

        .answers-container {
            width: 100%;
            min-height: 0;
            flex: 1;

            display: flex;
            flex-direction: column;
            align-items: center;

            margin-top: 4px;
        }

        .show-answers {
            font-family: monospace;
            font-size: 11px;

            background: black;
            color: #eee;

            border: 1px solid white;
            border-radius: 4px;

            padding: 4px 7px;
            cursor: pointer;
        }

        .show-answers:hover {
            background: #111;
        }

        .answers {
            width: 100%;
            min-height: 0;

            overflow-y: auto;
            overflow-x: hidden;

            margin-top: 4px;
            padding: 3px;

            font-size: 10px;
            line-height: 1.35;

            border-top: 1px solid #ddd;

            word-break: break-word;
        }

        /* =========================
           GAME OVER
           ========================= */

        #game-over {
            display: none;

            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);

            text-align: center;
            padding: 0;

            z-index: 100;
        }

        #game-over h2 {
            margin: 0 0 4px;
            font-size: 20px;
        }

        #final-score {
            font-size: 14px;
            margin-bottom: 6px;
        }

        #restart {
            font-family: monospace;
            font-size: 14px;

            background: black;
            color: #eee;

            border: 1px solid #999;
            border-radius: 4px;

            padding: 6px 14px;
            cursor: pointer;
        }

        #restart:hover {
            background: #111;
        }

        /* give up */

        #give-up {
            font-family: monospace;
            font-size: 11px;

            background: black;
            color: #eee;

            border: 1px solid #aaa;
            border-radius: 4px;

            padding: 4px 7px;
            cursor: pointer;
        }

        #give-up:hover {
            background: #111;
        }

        /* =========================
           SMALL SCREENS
           ========================= */

        @media (hover: none) or (pointer: coarse)  {

            /* Manual keyboard: no input element means no native keyboard. */
            #mobile-keyboard {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 40;

                display: grid;
                grid-template-columns: repeat(10, minmax(0, 1fr));
                gap: 4px;

                padding: 6px;
                background: #f4f4f4;
                border-top: 1px solid #bbb;
                box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.08);

                touch-action: manipulation;
            }

            .mobile-key {
                min-width: 0;
                height: 42px;
                padding: 0;

                font-family: monospace;
                font-size: 16px;
                font-weight: bold;

                background: white;
                color: #111;
                border: 1px solid #aaa;
                border-radius: 4px;

                cursor: pointer;
                -webkit-tap-highlight-color: transparent;
                touch-action: manipulation;
            }

            .mobile-key:active {
                background: #ddd;
            }

            .mobile-key.backspace {
                grid-column: span 1;
            }

            .mobile-key.enter {
                grid-column: span 3;
            }

            #game {
                padding-bottom: 150px;
            }
        }

        @media (max-width: 800px) {
            #puzzles {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: none;
                grid-auto-rows: minmax(180px, auto);
            }

            body {
                overflow-y: auto;
                overflow-x: hidden;
            }

            /* Sticky only on mobile. Desktop keeps the original layout. */
            #current-word-container {
                height: 53px;
                position: sticky;
                top: 0;
                z-index: 30;
                background: black;
                padding-top: 4px;
                padding-bottom: 4px;
                border: 1px solid white;
                border-radius: 4px;
            }

            #puzzles {
                padding-top: 8px;
            }

            #current-word-container.game-ended {
                z-index: -1;
                position: static;
            }

            #header.game-ended {
                visibility: hidden;
            }

            html, body {
                height: 100%;
            }

            #game {
                height: auto;
                min-height: 100vh;
            }

            .puzzle {
                max-height: 500px;
            }

            #hidden-keyboard-gateway {
                position: absolute;
                opacity: 0;
                font-size: 16px;
                z-index: 200000;
                left: 0;
                top: 0;
                width: 100vw;
                height: 100vh;
                background: red;
                -webkit-tap-highlight-color: transparent;
            }

            html, body {
                overflow-x: hidden;
            }
        }

        /* Completely absent from the desktop layout. */
        @media (hover: hover) and (pointer: fine)  {
            #mobile-keyboard {
                display: none;
            }

            #hidden-keyboard-gateway {
                display: none;
            }
        }

        @media (hover: hover) and (pointer: fine) and (min-width: 801px) {
            #small-screen-warn {
                display: none;
            }
        }
    </style>
</head>

<body>

<div id="game">

    <div id="header">
        <h1>Blackjack Caving 2</h1>

        <div id="stats">
            <button id="give-up">Give Up</button>
            <div id="timer">2:00</div>
            <div id="score">0</div>
        </div>
    </div>

    <div id="current-word-container">
        <div id="current-word"></div>

    </div>

    <div id="puzzles"></div>

    <div id="game-over">

    </div>

    <div id="mobile-keyboard" aria-label="Keyboard">
        <button type="button" class="mobile-key" data-key="Q">Q</button>
        <button type="button" class="mobile-key" data-key="W">W</button>
        <button type="button" class="mobile-key" data-key="E">E</button>
        <button type="button" class="mobile-key" data-key="R">R</button>
        <button type="button" class="mobile-key" data-key="T">T</button>
        <button type="button" class="mobile-key" data-key="Y">Y</button>

        <button type="button" class="mobile-key" data-key="I">I</button>
        <button type="button" class="mobile-key" data-key="O">O</button>
        <button type="button" class="mobile-key" data-key="P">P</button>

        <button type="button" class="mobile-key" data-key="A">A</button>
        <button type="button" class="mobile-key" data-key="S">S</button>

        <button type="button" class="mobile-key" data-key="Z">Z</button>

<script>
    "use strict";

    // document.getElementById('hidden-keyboard-gateway').focus()

    /* ============================================================
       WORD LIST
       ============================================================ */

    let wordList = [];
    let wordSet = new Set();


    /* ============================================================
       SUBSEQUENCE TEST
       ============================================================

       Returns true iff every character of small appears in big
       in the same order.

       Example:

           substr("CAT", "CHART") = true
           substr("CAT", "ACT")   = false
    */

    function substr(small, big) {
        let j = 0;

        for (let i = 0; i < big.length && j < small.length; i++) {
            if (big[i] === small[j]) {
                j++;
            }
        }

        return j === small.length;
    }


    /* ============================================================
       ANSWERS
       ============================================================ */

    function answers(sub) {
        const result = [];

        for (const word of wordList) {

            if (word.length < sub.length) {
                continue;
            }

            if (substr(sub, word)) {
                result.push(word);
            }
        }

        return result;
    }


    /* ============================================================
       RANDOM PUZZLE
       ============================================================ */

    function randomRack() {

        /*
            3 or 4 letters.
        */

        const length = Math.min(
            4,
            Math.floor(Math.random() * 3) + 3
        );

        let result = "";

        for (let i = 0; i < length; i++) {
            result += String.fromCharCode(
                65 + Math.floor(Math.random() * 26)
            );
        }

        return result;
    }


    /* ============================================================
       GENERATE 10 PUZZLES
       ============================================================ */

    function generatePuzzles() {

        const puzzles = [];

        for (let i = 0; i < 10; i++) {

            while (true) {

                const rack = randomRack();
                const ans = answers(rack);

                /*
                    Need at least 15 possible answers, all of which are 6+ letters.
                */

                if (ans.length < 15 || ans.some(word => word.length < 6) ) {
                    continue;
                }

                puzzles.push({
                    rack: rack,
                    answers: ans,

                    /*
                        Current best solution for this puzzle.
                    */
                    solution: null,

                    /*
                        Total points currently earned by that
                        solution.
                    */
                    points: 0,

                    solved: false,
                    bonusWord: null
                });

                break;
            }
        }

        /*
            Harder puzzles (fewer answers) first.
        */

        puzzles.sort((a, b) =>
            b.answers.length - a.answers.length
        );

        return puzzles;
    }


    /* ============================================================
       GAME STATE
       ============================================================ */

    let puzzles = [];

    let score = 0;

    let currentWord = "";

    let timeRemaining = 120;

    let timerInterval = null;

    let gameActive = false;


    /* ============================================================
       DISPLAY
       ============================================================ */

    function updateScore() {
        document.getElementById("score").textContent =
            score;
    }


    function updateCurrentWord() {
        document.getElementById("current-word").textContent =
            currentWord;
    }


    function updateTimer() {

        const minutes = Math.floor(timeRemaining / 60);

        const seconds = timeRemaining % 60;

        document.getElementById("timer").textContent =
            `${minutes}:${seconds.toString().padStart(2, "0")}`;
    }


    /* ============================================================
       PUZZLE RENDERING
       ============================================================ */

    function renderPuzzles() {

        const container =
            document.getElementById("puzzles");

        container.innerHTML = "";

        puzzles.forEach((puzzle, index) => {

            const div =
                document.createElement("div");

            div.className = "puzzle";

            if (puzzle.solved) {
                div.classList.add("solved");
            } else if (puzzle.bonusWord) {
                div.classList.add("bonus");
            }


            /*
                Puzzle number.
            */

            const number =
                document.createElement("div");

            number.className = "puzzle-number";

            number.textContent =
                `PUZZLE ${index + 1}`;

            div.appendChild(number);


            /*
                Puzzle letters.
            */

            const rack =
                document.createElement("div");

            rack.className = "puzzle-word";

            rack.textContent =
                puzzle.rack;

            div.appendChild(rack);


            /*
                Status.
            */

            const status =
                document.createElement("div");

            status.className = "puzzle-status";

            status.textContent = `${puzzle.answers.length} words`;

            div.appendChild(status);

            if (puzzle.bonusWord) {
                const bonus = document.createElement("div");
                bonus.className = "bonus-container";

                const bonusWord = document.createElement("span");
                bonusWord.className = "bonus-word";
                bonusWord.textContent = puzzle.bonusWord;

                const bonusLabel = document.createElement("span");
                bonusLabel.className = "bonus-label";
                bonusLabel.textContent = "(bonus word)";

                bonus.appendChild(bonusWord);
                bonus.appendChild(bonusLabel);
                div.appendChild(bonus);
            }


            /*
                Show current solution and scoring breakdown.
            */

            if (puzzle.solved) {

                const solution =
                    document.createElement("div");

                solution.className = "solution";


                /*
                    Word.
                */

                const word =
                    document.createElement("div");

                word.className =
                    "solution-word";

                word.textContent =
                    puzzle.solution;

                solution.appendChild(word);


                /*
                    Total score.
                */

                const total =
                    document.createElement("div");

                total.className =
                    "solution-total";

                total.textContent =
                    `+${puzzle.points.total}`;

                solution.appendChild(total);


                /*
                    Breakdown.

                    Each line is a two-column layout:

                        base         +162
                        shortest     +100
                        start ≠ V    +100
                        time          +42
                */

                const breakdown =
                    document.createElement("div");

                breakdown.className =
                    "score-breakdown";


                /*
                    Helper for creating a breakdown row.
                */

                function addScoreLine(label, value) {

                    const line =
                        document.createElement("div");

                    line.className =
                        "score-line";


                    const labelElement =
                        document.createElement("span");

                    labelElement.className =
                        "score-label";

                    labelElement.textContent =
                        label;


                    const valueElement =
                        document.createElement("span");

                    valueElement.className =
                        "score-value";

                    valueElement.textContent =
                        `+${value}`;


                    line.appendChild(labelElement);
                    line.appendChild(valueElement);

                    breakdown.appendChild(line);
                }


                /*
                    Base.
                */

                addScoreLine(
                    "base",
                    puzzle.points.base
                );


                /*
                    Shortest.
                */

                if (puzzle.points.shortest > 0) {

                    addScoreLine(
                        "shortest",
                        puzzle.points.shortest
                    );
                }

                /*
                    Length bonus.
                */

                if (puzzle.points.lengthBonus > 0) {

                    addScoreLine(
                        "length",
                        puzzle.points.lengthBonus
                    );
                }


                /*
                    Starting-letter bonus.

                    Instead of the long:
                        "not starting with V"

                    use:
                        "start ≠ V"
                */

                if (puzzle.points.startingLetter > 0) {

                    addScoreLine(
                        `start ≠ ${puzzle.rack[0]}`,
                        puzzle.points.startingLetter
                    );
                }


                /*
                    Time.
                */

                addScoreLine(
                    "time",
                    puzzle.points.time
                );


                solution.appendChild(breakdown);

                div.appendChild(solution);
            }


            /*
                Show answers after time is up.
            */

            if (!gameActive) {

                const answersContainer =
                    document.createElement("div");

                answersContainer.className =
                    "answers-container";


                const button =
                    document.createElement("button");

                button.className =
                    "show-answers";

                button.textContent =
                    "Show answers";


                const answerDiv =
                    document.createElement("div");

                answerDiv.className =
                    "answers";

                answerDiv.style.display =
                    "none";

                let showAllImmediately = true;
                let show;

                button.addEventListener(
                    "click",
                    (show = () => {

                        // Group answers by their total point value.
                        const groups = new Map();

                        for (const word of puzzle.answers) {
                            const points =
                                calculatePoints(puzzle, word).total;

                            if (!groups.has(points)) {
                                groups.set(points, []);
                            }

                            groups.get(points).push(word);
                        }

                        // Highest-scoring answers first.
                        const sortedGroups =
                            [...groups.entries()].sort(
                                (a, b) => b[0] - a[0]
                            );

                        answerDiv.innerHTML = "";

                        for (const [points, words] of sortedGroups) {

                            // Length + alphabetical order within each point group.
                            words.sort((a, b) => {
                                    if (a.length !== b.length) {
                                        return a.length - b.length;
                                    }
                                    return a.localeCompare(b)
                                }
                            );

                            const line =
                                document.createElement("div");

                            line.textContent =
                                `(${points}+)  ${words.join(", ")}`;

                            answerDiv.appendChild(line);
                        }

                        answerDiv.style.display =
                            "block";

                        button.style.display =
                            "none";
                    })
                );

                if (showAllImmediately) {
                    show();
                }


                answersContainer.appendChild(button);
                answersContainer.appendChild(answerDiv);

                div.appendChild(answersContainer);
            }


            container.appendChild(div);
        });
    }


    /* ============================================================
       MESSAGE
       ============================================================ */

    let messageTimeout = null;


    function showMessage(text) {

        const message =
            document.getElementById("message");

        message.textContent =
            text;

        clearTimeout(messageTimeout);

        messageTimeout =
            setTimeout(() => {
                message.textContent = "";
            }, 1000);
    }


    /* ============================================================
       POINT CALCULATION
       ============================================================

       Returns BOTH the total and its components.
    */

    function calculatePoints(puzzle, word) {

        /*
            BASE
        */

        const base =
            25 * Math.round(
                4 * Math.max(
                    1,
                    8 - Math.log2(puzzle.answers.length)
                )
            );


        /*
            SHORTEST
        */

        let shortestLength = Infinity;

        for (const answer of puzzle.answers) {
            shortestLength =
                Math.min(
                    shortestLength,
                    answer.length
                );
        }

        const shortest =
            word.length === shortestLength
                ? 250
                : 0;


        /*
            LENGTH BONUS

            Only applies if the word is NOT the shortest.

            Formula:
                max(0, 100 - 5 * word.length)
        */

        const lengthBonus =
            word.length !== shortestLength
                ? Math.max(0, 150 - 25 * (word.length - 7))
                : 0;


        /*
            STARTING LETTER
        */

        const startingLetter =
            word[0] !== puzzle.rack[0]
                ? 250
                : 0;


        /*
            TIME
        */

        const time =
            Math.ceil(
                25 * timeRemaining / 120
            );


        /*
            TOTAL
        */

        const total =
            base +
            shortest +
            lengthBonus +
            startingLetter +
            time;


        return {
            total: total,
            base: base,
            shortest: shortest,
            lengthBonus: lengthBonus,
            startingLetter: startingLetter,
            time: time
        };
    }


    /* ============================================================
       SUBMIT WORD
       ============================================================ */

    function submitWord() {

        if (!gameActive) {
            return;
        }

        if (currentWord.length === 0) {
            return;
        }


        const word =
            currentWord;


        /*
            Clear typing area immediately.
        */

        currentWord = "";

        updateCurrentWord();


        /* ========================================================
           1. IS IT A WORD?
           ======================================================== */

        if (!wordSet.has(word)) {

            showMessage("Not a word");

            return;
        }


        /* ========================================================
           2. IS IT AN ANSWER TO ANY PUZZLE?
           ======================================================== */

        let isCommonAnswer = false;

        for (const puzzle of puzzles) {
            if (puzzle.answers.includes(word)) {
                isCommonAnswer = true;
                break;
            }
        }

        /* Rare = in words_alpha.txt but not in CEL22. */
        const isRareWord = !wordList.includes(word);

        /* Bonus words solve a puzzle using the same subsequence rule. */
        const bonusPuzzles = isRareWord
            ? puzzles.filter(puzzle =>
                word.length >= puzzle.rack.length &&
                substr(puzzle.rack, word)
            )
            : [];

        if (bonusPuzzles.length > 0) {
            let showedBonus = false;

            for (const puzzle of bonusPuzzles) {
                // Don't show a bonus word on a puzzle that already has
                // a correct answer.
                if (puzzle.solved) {
                    continue;
                }

                puzzle.bonusWord = word;
                showedBonus = true;
            }

            if (showedBonus) {
                renderPuzzles();

                showMessage(
                    `(${word}) bonus word`
                );
            } else {
                showMessage(
                    "No improvement (bonus word)"
                );
            }

            return;
        }

        if (!isCommonAnswer) {
            showMessage("Not an answer");
            return;
        }

        /* ========================================================
           3. UPDATE EVERY PUZZLE THAT THIS WORD IMPROVES
           ======================================================== */

        let totalImprovement = 0;
        let improvedAny = false;

        for (const puzzle of puzzles) {
            if (!puzzle.answers.includes(word)) {
                continue;
            }

            const newPoints = calculatePoints(puzzle, word);
            const oldTotal = puzzle.points === 0 ? 0 : puzzle.points.total;
            const improvement = newPoints.total - oldTotal;

            if (improvement > 0) {
                puzzle.solution = word;
                puzzle.points = newPoints;
                puzzle.solved = true;
                puzzle.bonusWord = null;
                totalImprovement += improvement;
                improvedAny = true;
            }
        }

        if (!improvedAny) {
            showMessage("No improvement");
            return;
        }

        score += totalImprovement;
        updateScore();
        renderPuzzles();

        showMessage(`+${totalImprovement} (${word})`);

    }

    /* ============================================================
       KEYBOARD INPUT
       ============================================================

       There is intentionally no input box.

       The document receives the keyboard events regardless of
       which part of the page is focused.
    */

    function handleMobileKey(key) {

        if (!gameActive) {
            return;
        }

        if (key === "ENTER") {
            submitWord();
            return;
        }

        if (key === "BACKSPACE") {
            currentWord = currentWord.slice(0, -1);
            updateCurrentWord();
            return;
        }

        if (/^[A-Z]$/.test(key)) {
            currentWord += key;
            updateCurrentWord();
        }
    }

    document.querySelectorAll(".mobile-key").forEach(button => {

        button.addEventListener("touchstart", event => {
            event.preventDefault();
            handleMobileKey(button.dataset.key);
        }, { passive: false });

    });

    document.addEventListener("keydown", event => {

        if (!gameActive) {
            return;
        }


        /*
            ENTER or SPACE = submit.
        */

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            event.preventDefault();

            submitWord();

            return;
        }


        /*
            BACKSPACE = delete last letter.
        */

        if (event.key === "Backspace") {

            event.preventDefault();

            currentWord =
                currentWord.slice(0, -1);

            updateCurrentWord();

            return;
        }


        /*
            Only accept letters.
        */

        if (/^[a-zA-Z]$/.test(event.key) && !event.ctrlKey && !event.altKey && !event.metaKey) {

            event.preventDefault();

            currentWord +=
                event.key.toUpperCase();

            updateCurrentWord();
        }
    });


    /* ============================================================
       TIMER
       ============================================================ */

    function startTimer() {

        /*
            In case startTimer is somehow called while an old
            timer still exists, clear it first.
        */

        if (timerInterval !== null) {

            clearInterval(timerInterval);

            timerInterval = null;
        }


        timeRemaining = 120;

        updateTimer();


        timerInterval =
            setInterval(() => {

                timeRemaining--;

                if (timeRemaining < 0) {
                    timeRemaining = 0;
                }

                updateTimer();


                if (timeRemaining === 0) {

                    endGame();
                }

            }, 1000);
    }


    /* ============================================================
       END GAME
       ============================================================ */

    function endGame() {

        /*
            Prevent this from doing anything twice.
        */

        if (!gameActive) {
            return;
        }

        gameActive = false;


        if (timerInterval !== null) {

            clearInterval(timerInterval);

            timerInterval = null;
        }


        currentWord = "";

        updateCurrentWord();


        /*
            Re-render to show "Show answers" buttons.
        */

        renderPuzzles();


        document.getElementById("game-over")
            .style.display = "block";


        document.getElementById("final-score")
            .textContent =
            `Final score: ${score}`;
    }


    /* ============================================================
       START GAME
       ============================================================ */

    function getFile(filename) {
        return new Promise((resolve, reject) => {
            (async () => {
                const request = window.indexedDB.open("BlackjackCaving", 1);

                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (db.objectStoreNames.contains("files")) {
                        db.deleteObjectStore("files");
                    }
                    db.createObjectStore("files");
                };

                request.onerror = (event) => {
                    console.log("error", event.target.error);
                };

                request.onsuccess = async (event) => {
                    const db = event.target.result;

                    let gottenKey = await new Promise((resolve2, reject2) => {
                        const store = db.transaction(["files"], "readwrite").objectStore("files");
                        let getKeyReq = store.getKey(filename);
                        getKeyReq.onerror = (e) => { console.log("error", e.target.error); reject2(e) };
                        getKeyReq.onsuccess = (e) => { resolve2(getKeyReq.result) };
                    })
                    if (gottenKey === undefined) {
                        let resp = await fetch(filename);
                        if (!resp.ok) {
                            throw new Error("Could not load " + filename);
                        }
                        let text = await resp.text();

                        await new Promise((resolve2, reject2) => {
                            const store = db.transaction(["files"], "readwrite").objectStore("files");
                            let putReq = store.put(text, filename);
                            putReq.onerror = (e) => { console.log("error", e); reject2(e.target.error) };
                            putReq.onsuccess = (e) => { console.log("success"); resolve2() };
                        });
                    }
                    const store = db.transaction(["files"], "readwrite").objectStore("files");
                    let getReq = store.get(filename);
                    getReq.onerror = (event) => { console.log("error", event.target.error); reject(event.target.error) };
                    getReq.onsuccess = (event) => { resolve(getReq.result) }

                    db.close();
                };
            })();
        });
    }

    async function startGame() {

        /*
            Load CEL22.txt only once.
        */

        if (wordList.length === 0) {

            const commonText = await getFile("CEL22.txt");

            const rareText = await getFile("words_alpha.txt");

            wordList = [...new Set(
                commonText.split(/\r?\n/)
                    .map(word => word.trim().toUpperCase())
                    .filter(word => /^[A-Z]+$/.test(word))
            )];

            wordSet = new Set(
                rareText.split(/\r?\n/)
                    .map(word => word.trim().toUpperCase())
                    .filter(word => /^[A-Z]+$/.test(word))
            );
        }


        /*
            Reset game state.
        */

        puzzles =
            generatePuzzles();

        score =
            0;

        currentWord =
            "";

        gameActive =
            true;


        /*
            Hide game-over display.
        */

        document.getElementById("game-over")
            .style.display =
            "none";


        updateScore();

        updateCurrentWord();

        renderPuzzles();

        startTimer();
    }


    /* ============================================================
       RESTART BUTTON
       ============================================================ */

    document.getElementById("restart")
        .addEventListener(
            "click",
            () => {

                startGame().catch(error => {

                    console.error(error);

                    document.getElementById("message")
                        .textContent =
                        "Error loading word lists";
                });
            }
        );

    // give up

    document.getElementById("give-up").addEventListener("click", () => {
        timeRemaining = 0;
        updateTimer();
        endGame()
    });



    /* ============================================================
       INITIAL START
       ============================================================ */

    startGame().catch(error => {

        console.error(error);

        document.getElementById("message")
            .textContent =
            "Error loading word lists";
    });
</script>
